short_bio: >-
  <p class="bio-pitch">I build <span class="bio-hl">machine learning tools</span> that learn from the way people talk about their day, to better understand and support mental health.</p>
  <p class="bio-background">I'm a PhD candidate in Biomedical Informatics at Emory. My background is in biology and bioinformatics for genetics, and my current research interests include <span class="bio-hl-soft">digital voice biomarkers</span>, <span class="bio-hl-soft">ecological momentary assessment (EMA)</span>, and <span class="bio-hl-soft">improving mental health outcomes</span>.</p>

